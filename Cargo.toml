[package]
name = "deadcode"
version = "1.5.0"
edition = "2021"
description = "Polyglot dead-code detector: Rust host + embedded Python analyzer."

[lib]
name = "deadcode"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "deadcode"
path = "src/main.rs"

[dependencies]
walkdir = "2"
regex = "1"
pyo3 = { version = "0.29", features = ["extension-module", "auto-initialize"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
