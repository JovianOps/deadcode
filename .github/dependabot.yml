# .github/dependabot.yml
version: 2

multi-ecosystem-groups:
  app:
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  infra:
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "infra"

updates:
  # ── Application deps (add one entry per language) ──
  - package-ecosystem: "cargo"
    directory: "/"
    multi-ecosystem-group: "app"
    patterns: ["*"]
    cooldown:
      default-days: 3
      semver-major-days: 7

  # - package-ecosystem: "npm"
  #   directory: "/frontend"
  #   multi-ecosystem-group: "app"
  #   patterns: ["*"]
  #   cooldown:
  #     default-days: 3
  #     semver-major-days: 7

  # - package-ecosystem: "pip"
  #   directory: "/backend"
  #   multi-ecosystem-group: "app"
  #   patterns: ["*"]
  #   cooldown:
  #     default-days: 3
  #     semver-major-days: 7

  # ── Infra / tooling ──
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "infra"
    patterns: ["*"]
    cooldown:
      default-days: 3

